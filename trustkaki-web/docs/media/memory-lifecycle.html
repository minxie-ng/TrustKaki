<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal memory: save selectively, retrieve selectively</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&amp;family=Manrope:wght@600;700&amp;display=swap"><style>body{margin:0;background:#f2f6f3;color:#1d342b;font-family:'DM Sans',sans-serif}.diagram-container{width:100%;overflow-x:auto;max-width:100%;min-width:0}svg{display:block;width:100%;min-width:1280px}.name{font:600 19px 'Manrope',sans-serif;fill:#1d342b}.sub{font:400 14px 'DM Sans',sans-serif;fill:#587065}.tag{font:600 11px 'DM Sans',sans-serif;letter-spacing:1px;fill:#164f3e}.title{font:700 32px 'Manrope',sans-serif;fill:#164f3e}.lead{font:400 17px 'DM Sans',sans-serif;fill:#587065}@media print{.diagram-container{overflow-x:visible}svg{min-width:0}}</style></head><body><main><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="memory-lifecycle-title memory-lifecycle-desc"><title id="memory-lifecycle-title">Personal memory: save selectively, retrieve selectively</title><desc id="memory-lifecycle-desc">Explicit durable facts are validated before Neon storage, indexed for scoped retrieval, and revalidated against current source records before they enter a response.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#587065"/></marker></defs><rect width="1280" height="720" fill="#f2f6f3"/><text x="40" y="48" class="title">Personal memory: save selectively, retrieve selectively</text><text x="40" y="80" class="lead">Authenticated workflow · source evidence stays attached to every personal fact</text><path d="M 272 208 H 328" fill="none" stroke="#587065" stroke-width="2" marker-end="url(#arrow)"/><path d="M 560 208 H 616" fill="none" stroke="#587065" stroke-width="2" marker-end="url(#arrow)"/><path d="M 848 208 H 904" fill="none" stroke="#587065" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1020 280 V 360 Q 1020 368 1012 368 H 820 Q 812 368 812 376 V 440" fill="none" stroke="#587065" stroke-width="2" marker-end="url(#arrow)"/><path d="M 696 504 H 608" fill="none" stroke="#587065" stroke-width="2" marker-end="url(#arrow)"/><path d="M 376 504 H 288" fill="none" stroke="#587065" stroke-width="2" marker-end="url(#arrow)"/><g><rect x="40" y="144" width="232" height="136" rx="8" fill="#ffffff" stroke="#d9e4dc"/><text x="56" y="168" class="tag">SENIOR</text><text x="56" y="200" class="name">Current statement</text><text x="56" y="224" class="sub">Explicit durable fact</text><text x="56" y="244" class="sub">Not every chat message</text></g><g><rect x="328" y="144" width="232" height="136" rx="8" fill="#ffffff" stroke="#d9e4dc"/><text x="344" y="168" class="tag">MODEL + CODE</text><text x="344" y="200" class="name">Candidate + validation</text><text x="344" y="224" class="sub">Extract · check evidence</text><text x="344" y="244" class="sub">Scope · secrets · conflicts</text></g><g><rect x="616" y="144" width="232" height="136" rx="8" fill="#e6f1e8" stroke="#164f3e"/><text x="632" y="168" class="tag">SOURCE OF TRUTH</text><text x="632" y="200" class="name">Neon source records</text><text x="632" y="224" class="sub">Versions · source · status</text><text x="632" y="244" class="sub">Correction / deletion</text></g><g><rect x="904" y="144" width="232" height="136" rx="8" fill="#ffffff" stroke="#d9e4dc"/><text x="920" y="168" class="tag">DERIVED DATA</text><text x="920" y="200" class="name">Embedding + index</text><text x="920" y="224" class="sub">Provider embeddings</text><text x="920" y="244" class="sub">Neon pgvector search</text></g><g><rect x="696" y="440" width="232" height="128" rx="8" fill="#ffffff" stroke="#d9e4dc"/><text x="712" y="464" class="tag">NEXT CONVERSATION</text><text x="712" y="496" class="name">Scoped retrieval</text><text x="712" y="520" class="sub">Current query + identity</text><text x="712" y="540" class="sub">Only relevant candidates</text></g><g><rect x="376" y="440" width="232" height="128" rx="8" fill="#e6f1e8" stroke="#164f3e"/><text x="392" y="464" class="tag">CODE</text><text x="392" y="496" class="name">Revalidate sources</text><text x="392" y="520" class="sub">Active version · evidence</text><text x="392" y="540" class="sub">Exclude stale conflicts</text></g><g><rect x="56" y="440" width="232" height="128" rx="8" fill="#ffffff" stroke="#d9e4dc"/><text x="72" y="464" class="tag">TRIAGE</text><text x="72" y="496" class="name">Grounded response</text><text x="72" y="520" class="sub">Bounded personal context</text><text x="72" y="540" class="sub">Recent chat stays separate</text></g><line x1="40" y1="656" x2="1240" y2="656" stroke="#d9e4dc"/><text x="40" y="688" class="sub">Pinecone supplies configured embeddings; vectors and source records live in Neon. Memory never overrides safety policy.</text></svg></div></main></body></html>
